[package]
name = "svault-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "svault-manager"
path = "src/main.rs"

[dependencies]
svault-client = { path = "../svault-client" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "raw-window-handle-06"] }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
chrono.workspace = true
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"
winresource.workspace = true
