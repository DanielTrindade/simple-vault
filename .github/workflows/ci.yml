name: build-and-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Testes unitarios do workspace Rust
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc

      - name: Teste de fumaca do broker e MCP nativo
        shell: pwsh
        run: ./tests/run-smoke.ps1

      - name: Teste isolado do protocolo MCP via PowerShell
        shell: pwsh
        run: ./tests/Mcp.SmokeTest.ps1 -BrokerExe artifacts/broker/svault-broker.exe -McpExe artifacts/broker/svault-mcp.exe

      - name: Testes do pacote e rollback do instalador
        shell: pwsh
        run: |
          ./tests/InstallerPackage.SmokeTest.ps1
          ./tests/InstallRollback.SmokeTest.ps1

  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Gerar instalador Windows x64 (Full Rust) e checksum
        shell: pwsh
        run: |
          $buildArgs = @{}
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $buildArgs.ReleaseTag = $env:GITHUB_REF_NAME }
          ./install/Build-Installer.ps1 -CargoTarget x86_64-pc-windows-msvc @buildArgs

      - name: Disponibilizar instalador para testes
        uses: actions/upload-artifact@v4
        with:
          name: SVault-installer-windows-x64
          path: |
            artifacts/installer/SVault-Setup-*.exe
            artifacts/installer/SVault-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [test, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SVault-installer-windows-x64
          path: installer

      - name: Conferir checksum e publicar Release
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.exe ./*.sha256 \
            --verify-tag --title "SVault $RELEASE_TAG" --generate-notes
