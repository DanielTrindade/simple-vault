name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar
        run: dotnet build src/SVault.Broker/SVault.Broker.csproj -c Release

      - name: Instalar dependencias do servidor MCP
        working-directory: src/svault-mcp
        run: npm ci --no-audit --no-fund

      - name: Teste de fumaca do broker
        shell: pwsh
        run: ./tests/run-smoke.ps1

      - name: Teste de fumaca do servidor MCP
        shell: pwsh
        run: node tests/mcp-smoke.mjs artifacts/broker/svault-broker.exe src/svault-mcp/index.mjs
