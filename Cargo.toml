[workspace]
resolver = "3"
members = [
    "src/svault-core",
    "src/svault-client",
    "src/svault-broker",
    "src/svault-cli",
    "src/svault-mcp",
    "src/svault-manager",
    "tests/svault-smoke",
    "tests/svault-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
windows-sys = { version = "0.61" }
winresource = "0.1"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
